<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Giornaliera</title>
    
    <!-- PWA Meta Tags & Theme Color -->
    <meta name="theme-color" content="#274e31">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda">

    <!-- Tailwind CSS per un design pulito e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agenda: {
                            dark: '#1b3622',
                            primary: '#274e31',
                            light: '#527c52',
                            bg: '#f4f7f4',
                            card: '#ffffff',
                            accent: '#82a582'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            touch-action: pan-y;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-agenda-bg text-gray-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- HEADER SUPERIORE -->
    <header class="bg-agenda-primary text-white shadow-md px-4 py-3 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <button id="sidebarToggle" class="md:hidden text-white focus:outline-none text-xl p-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-calendar-days"></i> Agenda Personale
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="syncStatus" class="text-xs bg-agenda-light px-2 py-1 rounded-full text-white flex items-center gap-1">
                <i class="fa-solid fa-cloud"></i> <span id="syncText">Connessione...</span>
            </span>
            <button id="installBtn" class="hidden bg-white text-agenda-primary text-xs font-semibold px-3 py-1.5 rounded-lg shadow hover:bg-gray-100 transition">
                <i class="fa-solid fa-download"></i> Installa App
            </button>
        </div>
    </header>

    <!-- CORPO PRINCIPALE -->
    <div class="flex flex-1 relative overflow-hidden">

        <!-- OVERLAY PER MOBILE SIDEBAR -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity"></div>

        <!-- COLONNA LATERALE A SINISTRA (DATE) -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-40 w-72 bg-white border-r border-gray-200 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-lg md:shadow-none shrink-0">
            <div class="p-3 border-b border-gray-100 flex items-center justify-between bg-agenda-bg">
                <span class="font-semibold text-agenda-dark text-sm"><i class="fa-regular fa-calendar"></i> Seleziona Data</span>
                <button id="todayBtn" class="text-xs bg-agenda-primary text-white px-2.5 py-1 rounded shadow hover:bg-agenda-dark transition">Oggi</button>
            </div>
            <!-- Lista verticale delle date -->
            <div id="datesList" class="flex-1 overflow-y-auto p-2 space-y-1 hide-scrollbar">
                <!-- Generato via JavaScript -->
            </div>
        </aside>

        <!-- AREA CENTRALE PAGINA GIORNALIERA (SWIPE ORIZZONTALE) -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-agenda-bg relative" id="swipeContainer">
            <div id="pageCard" class="flex-1 flex flex-col p-4 md:p-6 overflow-y-auto max-w-4xl mx-auto w-full transition-transform duration-200">
                
                <!-- INTESTAZIONE GIORNO CORRENTE -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 flex items-center justify-between shrink-0">
                    <div>
                        <h2 id="currentDayTitle" class="text-xl md:text-2xl font-bold text-agenda-dark capitalize">--</h2>
                        <p id="currentDaySubtitle" class="text-xs md:text-sm text-gray-500">--</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="prevDayBtn" class="p-2 rounded-xl bg-gray-100 text-agenda-dark hover:bg-agenda-primary hover:text-white transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button id="nextDayBtn" class="p-2 rounded-xl bg-gray-100 text-agenda-dark hover:bg-agenda-primary hover:text-white transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- CONTENUTO GIORNALIERO: NOTE E ATTIVITÀ -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1 pb-16">
                    
                    <!-- BOX NOTE / APPUNTI -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col">
                        <label class="text-sm font-semibold text-agenda-dark mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-agenda-light"></i> Appunti del Giorno
                        </label>
                        <textarea id="dayNotes" placeholder="Scrivi qui i tuoi appunti, promemoria o note..." class="w-full flex-1 p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-agenda-primary resize-none text-sm"></textarea>
                    </div>

                    <!-- BOX TO-DO LIST (ATTIVITÀ) -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-semibold text-agenda-dark flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-agenda-light"></i> Attività & Task
                            </label>
                            <span id="taskCounter" class="text-xs text-gray-400">0 completate</span>
                        </div>
                        
                        <!-- Input Nuova Attività -->
                        <div class="flex gap-2 mb-3">
                            <input type="text" id="newTaskInput" placeholder="Aggiungi una nuova attività..." class="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-agenda-primary">
                            <button id="addTaskBtn" class="bg-agenda-primary text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-agenda-dark transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>

                        <!-- Lista Attività -->
                        <div id="taskList" class="flex-1 overflow-y-auto space-y-2 pr-1 hide-scrollbar">
                            <!-- Inserite dinamicamente -->
                        </div>
                    </div>

                </div>

            </div>
        </main>

    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE FIREBASE (Inserisci i tuoi dati)
        // ==========================================
        const firebaseConfig = {
            apiKey: "INSERISCI_API_KEY",
            authDomain: "INSERISCI_AUTH_DOMAIN",
            databaseURL: "INSERISCI_DATABASE_URL", // es. https://agenda-riccardo-default-rtdb.europe-west1.firebasedatabase.app
            projectId: "INSERISCI_PROJECT_ID",
            storageBucket: "INSERISCI_STORAGE_BUCKET",
            messagingSenderId: "INSERISCI_MESSAGING_SENDER_ID",
            appId: "INSERISCI_APP_ID"
        };

        let db = null;
        let useCloud = false;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "INSERISCI_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                useCloud = true;
                document.getElementById('syncText').innerText = "Cloud Attivo";
            } else {
                document.getElementById('syncText').innerText = "Modo Locale";
            }
        } catch (e) {
            console.warn("Firebase non configurato, uso localStorage.", e);
            document.getElementById('syncText').innerText = "Solo Locale";
        }

        // ==========================================
        // GESTIONE AGENDA & STATO
        // ==========================================
        const today = new Date();
        let currentDateStr = formatDateKey(today);
        let agendaData = {}; // Struttura: { "YYYY-MM-DD": { notes: "", tasks: [] } }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Inizializza date (un anno prima e un anno dopo)
        const datesListEl = document.getElementById('datesList');
        const dayNotesEl = document.getElementById('dayNotes');
        const taskListEl = document.getElementById('taskList');
        const newTaskInputEl = document.getElementById('newTaskInput');
        const addTaskBtnEl = document.getElementById('addTaskBtn');

        let allDates = [];

        function generateDatesRange() {
            datesListEl.innerHTML = '';
            allDates = [];
            const startDate = new Date();
            startDate.setFullYear(today.getFullYear() - 1);
            
            for (let i = 0; i < 730; i++) {
                const d = new Date(startDate);
                d.setDate(startDate.getDate() + i);
                const dStr = formatDateKey(d);
                allDates.push(dStr);

                const item = document.createElement('div');
                item.className = `date-item px-3 py-2.5 rounded-xl cursor-pointer text-sm flex items-center justify-between transition ${dStr === currentDateStr ? 'bg-agenda-primary text-white font-semibold shadow' : 'hover:bg-gray-100 text-gray-700'}`;
                item.dataset.date = dStr;

                const options = { weekday: 'short', day: 'numeric', month: 'short' };
                item.innerHTML = `<span>${d.toLocaleDateString('it-IT', options)}</span><span class="has-content-dot text-xs ${hasData(dStr) ? 'opacity-100' : 'opacity-0'}"><i class="fa-solid fa-circle text-[8px] ${dStr === currentDateStr ? 'text-white' : 'text-agenda-light'}"></i></span>`;

                item.addEventListener('click', () => {
                    changeDate(dStr);
                    toggleSidebar(false);
                });

                datesListEl.appendChild(item);
            }
        }

        function hasData(dateStr) {
            const data = agendaData[dateStr];
            return data && ((data.notes && data.notes.trim() !== '') || (data.tasks && data.tasks.length > 0));
        }

        function updateSidebarActive() {
            document.querySelectorAll('.date-item').forEach(el => {
                const dStr = el.dataset.date;
                const dot = el.querySelector('.has-content-dot');
                if (hasData(dStr)) {
                    dot.classList.remove('opacity-0');
                    dot.classList.add('opacity-100');
                } else {
                    dot.classList.remove('opacity-100');
                    dot.classList.add('opacity-0');
                }

                if (dStr === currentDateStr) {
                    el.className = "date-item px-3 py-2.5 rounded-xl cursor-pointer text-sm flex items-center justify-between transition bg-agenda-primary text-white font-semibold shadow";
                    const iconDot = dot.querySelector('i');
                    iconDot.className = "fa-solid fa-circle text-[8px] text-white";
                } else {
                    el.className = "date-item px-3 py-2.5 rounded-xl cursor-pointer text-sm flex items-center justify-between transition hover:bg-gray-100 text-gray-700";
                    const iconDot = dot.querySelector('i');
                    iconDot.className = "fa-solid fa-circle text-[8px] text-agenda-light";
                }
            });
        }

        function scrollToActiveDate() {
            const activeEl = document.querySelector(`.date-item[data-date="${currentDateStr}"]`);
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function loadDayData() {
            const [y, m, d] = currentDateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);

            const optionsTitle = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('currentDayTitle').innerText = dateObj.toLocaleDateString('it-IT', optionsTitle);
            document.getElementById('currentDaySubtitle').innerText = `Gestione impegni e appunti`;

            const data = agendaData[currentDateStr] || { notes: '', tasks: [] };
            dayNotesEl.value = data.notes || '';
            renderTasks(data.tasks || []);
            updateSidebarActive();
        }

        function changeDate(newDateStr) {
            saveCurrentDataToMemory();
            currentDateStr = newDateStr;
            loadDayData();
            scrollToActiveDate();
        }

        function saveCurrentDataToMemory() {
            if (!agendaData[currentDateStr]) {
                agendaData[currentDateStr] = { notes: '', tasks: [] };
            }
            agendaData[currentDateStr].notes = dayNotesEl.value;
            syncDataStorage();
        }

        // ==========================================
        // GESTIONE TASK / ATTIVITÀ
        // ==========================================
        function renderTasks(tasks) {
            taskListEl.innerHTML = '';
            let completedCount = 0;

            tasks.forEach((task, index) => {
                if (task.completed) completedCount++;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2.5 rounded-xl border transition ${task.completed ? 'bg-gray-50 border-gray-200 text-gray-400 line-through' : 'bg-white border-gray-100 text-gray-700 shadow-sm'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} class="w-4 h-4 accent-agenda-primary rounded cursor-pointer" onchange="toggleTask(${index})">
                        <span class="text-sm truncate">${escapeHtml(task.text)}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-gray-400 hover:text-red-500 p-1 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                taskListEl.appendChild(div);
            });

            document.getElementById('taskCounter').innerText = `${completedCount}/${tasks.length} completate`;
        }

        function addTask() {
            const text = newTaskInputEl.value.trim();
            if (!text) return;

            if (!agendaData[currentDateStr]) {
                agendaData[currentDateStr] = { notes: '', tasks: [] };
            }
            agendaData[currentDateStr].tasks.push({ text: text, completed: false });
            newTaskInputEl.value = '';
            loadDayData();
            syncDataStorage();
        }

        window.toggleTask = function(index) {
            if (agendaData[currentDateStr] && agendaData[currentDateStr].tasks[index]) {
                agendaData[currentDateStr].tasks[index].completed = !agendaData[currentDateStr].tasks[index].completed;
                loadDayData();
                syncDataStorage();
            }
        };

        window.deleteTask = function(index) {
            if (agendaData[currentDateStr] && agendaData[currentDateStr].tasks[index]) {
                agendaData[currentDateStr].tasks.splice(index, 1);
                loadDayData();
                syncDataStorage();
            }
        };

        newTaskInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        addTaskBtnEl.addEventListener('click', addTask);

        dayNotesEl.addEventListener('input', () => {
            if (!agendaData[currentDateStr]) {
                agendaData[currentDateStr] = { notes: '', tasks: [] };
            }
            agendaData[currentDateStr].notes = dayNotesEl.value;
            syncDataStorage();
            updateSidebarActive();
        });

        // ==========================================
        // SINCRONIZZAZIONE DATI (FIREBASE & LOCALSTORAGE)
        // ==========================================
        function syncDataStorage() {
            if (useCloud && db) {
                db.ref('agendaData').set(agendaData).catch(err => console.error("Errore sync cloud:", err));
            } else {
                localStorage.setItem('agenda_riccardo_data', JSON.stringify(agendaData));
            }
        }

        function loadInitialData() {
            if (useCloud && db) {
                db.ref('agendaData').on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        agendaData = val;
                    } else {
                        agendaData = {};
                    }
                    loadDayData();
                });
            } else {
                const local = localStorage.getItem('agenda_riccardo_data');
                if (local) {
                    try { agendaData = JSON.parse(local); } catch(e) { agendaData = {}; }
                }
                loadDayData();
            }
        }

        // ==========================================
        // NAVIGAZIONE & SWIPE ORIZZONTALE
        // ==========================================
        document.getElementById('prevDayBtn').addEventListener('click', () => {
            const idx = allDates.indexOf(currentDateStr);
            if (idx > 0) changeDate(allDates[idx - 1]);
        });

        document.getElementById('nextDayBtn').addEventListener('click', () => {
            const idx = allDates.indexOf(currentDateStr);
            if (idx < allDates.length - 1) changeDate(allDates[idx + 1]);
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            changeDate(formatDateKey(new Date()));
        });

        // Gestione Swipe Orizzontale Touch
        const swipeContainer = document.getElementById('swipeContainer');
        let touchStartX = 0;
        let touchEndX = 0;

        swipeContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        swipeContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                // Swipe a sinistra -> Giorno successivo
                const idx = allDates.indexOf(currentDateStr);
                if (idx < allDates.length - 1) changeDate(allDates[idx + 1]);
            }
            if (touchEndX > touchStartX + threshold) {
                // Swipe a destra -> Giorno precedente
                const idx = allDates.indexOf(currentDateStr);
                if (idx > 0) changeDate(allDates[idx - 1]);
            }
        }

        // Sidebar toggle mobile
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarToggle = document.getElementById('sidebarToggle');

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        sidebarToggle.addEventListener('click', () => toggleSidebar(sidebar.classList.contains('-translate-x-full')));
        sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // PWA Manifest dinamico e Service Worker
        const manifestData = {
            name: "Agenda Personale",
            short_name: "Agenda",
            start_url: "./",
            display: "standalone",
            background_color: "#f4f7f4",
            theme_color: "#274e31",
            icons: [{ src: "https://cdn-icons-png.flaticon.com/512/2693/2693507.png", sizes: "512x512", type: "image/png" }]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestURL;
        document.head.appendChild(linkManifest);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `)).catch(err => console.log("SW error", err));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // Avvio iniziale
        generateDatesRange();
        loadInitialData();
        setTimeout(scrollToActiveDate, 100);
    </script>
</body>
</html>
